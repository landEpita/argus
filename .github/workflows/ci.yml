name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: argus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      # Runs every repository and cache test against the real servers as well.
      ARGUS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/argus_test
      ARGUS_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - name: Migrations apply cleanly to Postgres and match the models
        env:
          ARGUS_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/argus_test
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

  contract:
    # The committed OpenAPI document and TS types must match what the backend produces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && uv sync --frozen
      - run: cd frontend && npm ci
      - run: make api-types
      - name: Fail if generated files drifted
        run: git diff --exit-code -- frontend/openapi.json frontend/src/lib/api/schema.gen.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [backend, contract, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait --wait-timeout 180
      - name: Smoke test through the frontend proxy
        run: |
          curl -fsS http://localhost:3000/api/v1/system/ready
          curl -fsS http://localhost:3000/ > /dev/null
          # Static assets are not part of Next's standalone output: check they ship.
          curl -fsS http://localhost:3000/geo/countries-110m.json > /dev/null
      - if: failure()
        run: docker compose logs
